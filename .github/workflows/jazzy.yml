name: ROS 2 Jazzy
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build pinned dependencies and all packages
        run: docker build -t plvins:jazzy .
      - name: Validate C++, Python, linkage, and ROS 2 pipeline
        run: |
          docker run --rm plvins:jazzy bash -c '
            set -e
            source tools/setup.bash
            colcon test --event-handlers console_direct+
            colcon test-result --verbose
            .venv/bin/python -m unittest discover -s tests -p "test_*.py"
            python3 tools/check_linkage.py
            .venv/bin/python tests/smoke_ros2.py
          '
